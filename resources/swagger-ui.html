<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mailcore API — Swagger UI</title>
  <!-- Swagger UI assets from CDN (needs internet when viewing). The spec itself
       is served locally next to this file as ./openapi.yaml. -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: './openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      // The live API sends no CORS headers, so route "Try it out" calls through
      // the same-origin PHP proxy (/__proxy/...) instead of hitting the API host
      // directly. Local spec/asset fetches (same origin already) are left alone.
      requestInterceptor: (req) => {
        if (!/^https?:\/\/(localhost|127\.0\.0\.1)(:|\/)/.test(req.url)) {
          req.url = req.url.replace(/^https?:\/\/[^/]+/, window.location.origin + '/__proxy');
        }
        return req;
      },
    });
  </script>
</body>
</html>
